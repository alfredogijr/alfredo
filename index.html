<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alow Barra da Tijuca — Apresentações</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #0D2137 0%, #1565C0 100%);
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 32px 20px;
  }
  .logo { width: 120px; height: 120px; border-radius: 50%; overflow: hidden;
    border: 4px solid rgba(255,255,255,0.3); margin-bottom: 24px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
  .logo img { width:100%; height:100%; object-fit:cover; }
  h1 { color: white; font-size: 28px; font-weight: 900; margin-bottom: 6px; text-align:center; }
  h1 span { color: #8BC34A; }
  p { color: rgba(255,255,255,0.7); margin-bottom: 48px; text-align:center; }
  .cards { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
  .card {
    background: white; border-radius: 16px; padding: 32px 28px;
    width: 280px; text-align: center;
    box-shadow: 0 12px 40px rgba(0,0,0,0.3);
    transition: transform 0.2s;
  }
  .card:hover { transform: translateY(-4px); }
  .card .icon { font-size: 40px; margin-bottom: 16px; display:block; }
  .card h2 { font-size: 18px; font-weight: 800; color: #0D2137; margin-bottom: 8px; }
  .card p { font-size: 14px; color: #546E7A; margin-bottom: 24px; }
  .card a {
    display: block; background: #1565C0; color: white;
    padding: 12px 0; border-radius: 30px; font-weight: 700;
    text-decoration: none; font-size: 15px;
    transition: background 0.2s;
  }
  .card a:hover { background: #29B6F6; }
  .card.green a { background: #7CB342; }
  .card.green a:hover { background: #8BC34A; }
</style>
</head>
<body>
  <div class="logo">
    <!-- logo inline não incluída neste index para manter o arquivo leve -->
  </div>
  <h1>Alow <span>Barra</span> da Tijuca</h1>
  <p>Escolha a apresentação</p>
  <div class="cards">
    <div class="card">
      <span class="icon">🎟️</span>
      <h2>Para o Público Geral</h2>
      <p>5 slides — o que é, como funciona, categorias e como acessar</p>
      <a href="apresentacao-publico-geral.html">Ver apresentação →</a>
    </div>
    <div class="card green">
      <span class="icon">🏪</span>
      <h2>Para Lojistas</h2>
      <p>7 slides — benefícios, como funciona e captação de parceiros</p>
      <a href="apresentacao-lojistas.html">Ver apresentação →</a>
    </div>
  </div>
</body>
</html>
